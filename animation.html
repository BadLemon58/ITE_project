<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSAMS Loading Screen</title>
  <style>
    /* Import Montserrat font from Google Fonts to match the logo text */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

    body {
      margin: 0;
      background-color: #f8f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fallback for general text */
      overflow: hidden;
    }

    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.8s ease;
    }

    .q-ring {
      stroke-dasharray: 380;
      stroke-dashoffset: 380;
      animation: drawRing 1.2s ease-out forwards, pulseRing 2s infinite 1.2s alternate;
    }

    .q-tail {
      opacity: 0;
      transform: translate(-15px, -15px);
      animation: slideInTail 0.6s ease-out 1s forwards, glowTail 2s infinite 1.6s alternate;
    }

    .qr-code-group {
      opacity: 0;
      transform: scale(0.5);
      transform-origin: 155px 145px;
      animation: popInQR 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.3s forwards;
    }

    .qsams-text {
      margin-top: 15px;
      font-family: 'Montserrat', sans-serif; /* Applied the matching font */
      font-size: 3.2rem;
      font-weight: 800; /* Extra Bold */
      color: #064e3b; /* Dark Green */
      letter-spacing: 2px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeText 0.8s ease-out 1.6s forwards;
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes pulseRing {
      to { 
        stroke: #0a664a; 
        filter: drop-shadow(0 0 6px rgba(6, 78, 59, 0.3)); 
      }
    }

    @keyframes slideInTail {
      to { 
        opacity: 1; 
        transform: translate(0, 0); 
      }
    }

    @keyframes glowTail {
      to { filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.8)); }
    }

    @keyframes popInQR {
      to { 
        opacity: 1; 
        transform: scale(1); 
      }
    }

    @keyframes fadeText {
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="loader-wrapper" id="qsams-loader">
    <svg width="220" height="200" viewBox="0 0 220 200">
      
      <circle class="q-ring" cx="95" cy="95" r="60" fill="none" stroke="#064e3b" stroke-width="24" />
      
      <g class="qr-code-group" fill="#064e3b">
        <rect x="138" y="125" width="13" height="13" fill="none" stroke="#064e3b" stroke-width="2"/>
        <rect x="141.5" y="128.5" width="6" height="6" />
        
        <rect x="162" y="125" width="13" height="13" fill="none" stroke="#064e3b" stroke-width="2"/>
        <rect x="165.5" y="128.5" width="6" height="6" />

        <rect x="138" y="149" width="13" height="13" fill="none" stroke="#064e3b" stroke-width="2"/>
        <rect x="141.5" y="152.5" width="6" height="6" />

        <rect x="154" y="125" width="5" height="4" />
        <rect x="154" y="132" width="5" height="4" />
        <rect x="138" y="141" width="4" height="5" />
        <rect x="145" y="140" width="3" height="6" />
        <rect x="151" y="139" width="6" height="4" />
        <rect x="160" y="141" width="8" height="4" />
        <rect x="171" y="140" width="4" height="5" />
        <rect x="154" y="146" width="4" height="6" />
        <rect x="161" y="148" width="5" height="5" />
        <rect x="169" y="148" width="6" height="6" />
        <rect x="159" y="156" width="4" height="6" />
        <rect x="166" y="156" width="5" height="3" />
        <rect x="165" y="161" width="4" height="4" />
        <rect x="154" y="155" width="3" height="4" />
      </g>

      <path class="q-tail" d="M 105 105 L 165 165" stroke="#22c55e" stroke-width="20" stroke-linecap="square" />
      <line class="q-tail" x1="125" y1="175" x2="195" y2="160" stroke="#22c55e" stroke-width="4" />

    </svg>
    
    <div class="qsams-text">QSAMS</div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('qsams-loader').classList.add('fade-out');
      }, 3500); 
    });
  </script>

</body>
</html>
